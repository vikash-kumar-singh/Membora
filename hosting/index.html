<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263238">
  <title>Membora</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f6; color: #18201e; }
    main { width: min(92vw, 560px); padding: 48px 36px; border: 1px solid #dbe5e1; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px rgba(20, 54, 46, .10); text-align: center; }
    .mark { width: 68px; height: 68px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 20px; background: #176b55; color: white; font-size: 32px; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); letter-spacing: -.06em; }
    p { margin: 18px auto 0; max-width: 38ch; color: #53635f; font-size: 1.05rem; line-height: 1.65; }
    nav { display: flex; justify-content: center; gap: 10px; margin-top: 24px; color: #80908a; }
    a { color: #176b55; text-underline-offset: 3px; }
    small { display: block; margin-top: 32px; color: #76847f; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>Membora</h1>
    <p>Memberships, payments, staff, and communication—managed in one secure workspace.</p>
    <nav aria-label="Legal">
      <a href="/privacy">Privacy policy</a>
      <span aria-hidden="true">•</span>
      <a href="/account-deletion">Delete an account</a>
    </nav>
    <small>Open the Membora Android app to continue.</small>
  </main>
</body>
</html>
