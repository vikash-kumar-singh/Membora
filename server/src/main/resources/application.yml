spring:
  application:
    name: membora-server
  datasource:
    url: jdbc:h2:mem:membora;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

server:
  # Cloud/container platforms inject PORT; local development continues to use 8080.
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info

membora:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:membora-app}
  play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.membora.app}
    product-id: ${GOOGLE_PLAY_SUBSCRIPTION_PRODUCT_ID:membora_premium}
    rtdn-audience: ${GOOGLE_PLAY_RTDN_AUDIENCE:}
    rtdn-service-account-email: ${GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL:}
  imagekit:
    public-key: ${IMAGEKIT_PUBLIC_KEY:public_cNDr0TfiDtmw5Dgx+VVpRBo7+C4=}
    private-key: ${IMAGEKIT_PRIVATE_KEY:}
    url-endpoint: ${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/membora}
  messaging:
    whatsapp:
      access-token: ${META_WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}
      api-version: ${META_WHATSAPP_API_VERSION:v23.0}
      language-code: ${META_WHATSAPP_LANGUAGE_CODE:en}
      membership-expiring-template: ${META_WHATSAPP_TEMPLATE_MEMBERSHIP_EXPIRING:}
      membership-expired-template: ${META_WHATSAPP_TEMPLATE_MEMBERSHIP_EXPIRED:}
      payment-due-template: ${META_WHATSAPP_TEMPLATE_PAYMENT_DUE:}
      birthday-template: ${META_WHATSAPP_TEMPLATE_BIRTHDAY:}
      welcome-template: ${META_WHATSAPP_TEMPLATE_WELCOME:}
      payment-received-template: ${META_WHATSAPP_TEMPLATE_PAYMENT_RECEIVED:}
      renewal-thanks-template: ${META_WHATSAPP_TEMPLATE_RENEWAL_THANKS:}
    sms:
      auth-key: ${MSG91_AUTH_KEY:}
      default-country-calling-code: ${MSG91_DEFAULT_COUNTRY_CALLING_CODE:91}
      membership-expiring-template-id: ${MSG91_TEMPLATE_MEMBERSHIP_EXPIRING:}
      membership-expired-template-id: ${MSG91_TEMPLATE_MEMBERSHIP_EXPIRED:}
      payment-due-template-id: ${MSG91_TEMPLATE_PAYMENT_DUE:}
      birthday-template-id: ${MSG91_TEMPLATE_BIRTHDAY:}
      welcome-template-id: ${MSG91_TEMPLATE_WELCOME:}
      payment-received-template-id: ${MSG91_TEMPLATE_PAYMENT_RECEIVED:}
      renewal-thanks-template-id: ${MSG91_TEMPLATE_RENEWAL_THANKS:}
    webhooks:
      meta-verify-token: ${META_WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
      meta-app-secret: ${META_APP_SECRET:}
      msg91-token: ${MSG91_WEBHOOK_TOKEN:}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 30
