spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

membora:
  security:
    jwt-secret: ${JWT_SECRET}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
  imagekit:
    # Optional legacy-media integration. New Android uploads use Firebase Storage.
    private-key: ${IMAGEKIT_PRIVATE_KEY:}
    public-key: ${IMAGEKIT_PUBLIC_KEY:public_cNDr0TfiDtmw5Dgx+VVpRBo7+C4=}
    url-endpoint: ${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/membora}
